[Settings]
; Configuración de la velocidad del menú de Dormir/Esperar.
; Define cuántos segundos de la vida real debe tomar esperar un ciclo completo de 24 horas en el juego.
; 
; Opciones válidas:
; 6 = Estable (Equivalente a 12 iteraciones de la interfaz. Máxima estabilidad para la simulación de extractores)
; 4 = Rápido (Equivalente a 8 iteraciones de la interfaz. Otorga una ligera bonificación de extracción)
; 3 = Muy Rápido (Equivalente a 6 iteraciones de la interfaz. Límite de equilibrio estadístico)
;
; Nota: Las opciones 1 y 2 fueron eliminadas permanentemente ya que causan un desbordamiento masivo en 
; el calendario interno del motor (aborto prematuro del ciclo). 
; Cualquier valor inválido, letras o dejarlo en blanco forzará el valor seguro por defecto (4).
WaitSeconds=4

[Hotkeys]
; Tecla modificadora que debe mantenerse presionada (ej., Shift, Ctrl, Alt). 
; Si prefieres usar una sola tecla sin combinación, establece este valor en 0.
; 
; Ejemplos comunes:
; 16 = Shift
; 17 = Ctrl
; 18 = Alt
; 0  = Desactivado (Usa solo la tecla principal)
ModifierKey=16

; Tecla principal para alternar entre el modo Turbo y el modo Vanilla (juego base).
; El valor por defecto es 84 (Tecla 'T').
;
; --- ALFABETO ---      --- NÚMEROS Y TECLAS F ---   --- NAVEGACIÓN Y ESPECIALES ---
; A = 65    N = 78      0 = 48       F1  = 112       Backspace = 8     Insert = 45
; B = 66    O = 79      1 = 49       F2  = 113       Tab       = 9     Delete = 46
; C = 67    P = 80      2 = 50       F3  = 114       Enter     = 13    Home   = 36
; D = 68    Q = 81      3 = 51       F4  = 115       Shift     = 16    End    = 35
; E = 69    R = 82      4 = 52       F5  = 116       Ctrl      = 17    PageUp = 33
; F = 70    S = 83      5 = 53       F6  = 117       Alt       = 18    PageDn = 34
; G = 71    T = 84      6 = 54       F7  = 118       Pause     = 19    Up     = 38
; H = 72    U = 85      7 = 55       F8  = 119       CapsLock  = 20    Down   = 40
; I = 73    V = 86      8 = 56       F9  = 120       Esc       = 27    Left   = 37
; J = 74    W = 87      9 = 57       F10 = 121       Space     = 32    Right  = 39
; K = 75    X = 88                   F11 = 122
; L = 76    Y = 89      --- TECLADO NUMÉRICO ---     F12 = 123
; M = 77    Z = 90      Num0 = 96    Num5 = 101      Num * = 106       Num + = 107
;                       Num1 = 97    Num6 = 102      Num - = 109       Num . = 110
;                       Num2 = 98    Num7 = 103      Num / = 111
;                       Num3 = 99    Num8 = 104
;                       Num4 = 100   Num9 = 105
MainKey=84