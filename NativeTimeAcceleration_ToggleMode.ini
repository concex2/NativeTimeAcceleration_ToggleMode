[Settings]
; Configuration for the Sleep/Wait menu speed.
; Defines how many in-game hours advance visually for each jump in the menu.
; 
; Valid options:
; 2 = 2 Hours per jump
; 3 = 3 Hours per jump (Recommended. Statistical equilibrium limit for extractor simulation)
; 4 = 4 Hours per jump (Grants a slight extraction bonus, lower stability)
;
; Note: Values higher than 4 cause a massive overflow in 
; the engine's internal calendar (premature cycle abort). 
; Any invalid numerical value, letters, or leaving it blank will force the safe default value (3).
;
; NEW!: Auto-wake and hot-swap system.
; Hold down your Modifier key (e.g., Shift) and press 2, 3 or 4 
; (top row or numpad) to turn on Turbo mode at that speed instantly.
; Press Modifier + 1 to force the original Vanilla mode (1-hour visual jumps).
HoursPerTick=3

[Hotkeys]
; Modifier key that must be held down (e.g., Shift, Ctrl, Alt). 
; If you prefer to use a single key without a combination, set this value to 0.
; IMPORTANT: This key is also used for quick speed swapping and forced Vanilla (Modifier + 1/2/3/4).
; 
; Common examples:
; 16 = Shift
; 17 = Ctrl
; 18 = Alt
; 0  = Disabled (Uses only the main key for the toggle. Quick speed swapping will require pressing the numbers by themselves)
ModifierKey=16

; Main key to toggle between the last used Turbo mode and Vanilla mode (base game).
; Default value is 84 ('T' Key).
;
; --- ALPHABET ---      --- NUMBERS & F-KEYS ---     --- NAVIGATION & SPECIAL ---
; A = 65    N = 78      0 = 48       F1  = 112       Backspace = 8     Insert = 45
; B = 66    O = 79      1 = 49       F2  = 113       Tab       = 9     Delete = 46
; C = 67    P = 80      2 = 50       F3  = 114       Enter     = 13    Home   = 36
; D = 68    Q = 81      3 = 51       F4  = 115       Shift     = 16    End    = 35
; E = 69    R = 82      4 = 52       F5  = 116       Ctrl      = 17    PageUp = 33
; F = 70    S = 83      5 = 53       F6  = 117       Alt       = 18    PageDn = 34
; G = 71    T = 84      6 = 54       F7  = 118       Pause     = 19    Up     = 38
; H = 72    U = 85      7 = 55       F8  = 119       CapsLock  = 20    Down   = 40
; I = 73    V = 86      8 = 56       F9  = 120       Esc       = 27    Left   = 37
; J = 74    W = 87      9 = 57       F10 = 121       Space     = 32    Right  = 39
; K = 75    X = 88                   F11 = 122
; L = 76    Y = 89      --- NUMPAD ---               F12 = 123
; M = 77    Z = 90      Num0 = 96    Num5 = 101      Num * = 106       Num + = 107
;                       Num1 = 97    Num6 = 102      Num - = 109       Num . = 110
;                       Num2 = 98    Num7 = 103      Num / = 111
;                       Num3 = 99    Num8 = 104
;                       Num4 = 100   Num9 = 105
MainKey=84